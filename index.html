<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포켓몬 서버 프로필 관리</title>
    <!-- Google Fonts & FontAwesome 아이콘 추가 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', 'Segoe UI', sans-serif;
            background: #111214;
            color: #dbdee1;
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
        }
        
        /* Header */
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        header h1 {
            color: #ffffff;
            font-size: 2rem;
            margin: 0 0 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        header h1 i { color: #ffcb05; }
        header p {
            color: #949ba4;
            margin: 0;
            font-size: 0.95rem;
        }

        /* Container & Cards */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            max-width: 1280px;
            margin: 0 auto;
        }
        .profile-card {
            background: #2b2d31;
            border: 1px solid #35363c;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
        }
        .profile-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.4);
            border-color: #5865f2;
        }
        
        /* Profile Header */
        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3f4147;
            padding-bottom: 14px;
            margin-bottom: 16px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #5865f2, #eb459e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #white;
            font-size: 1.1rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .profile-header h2 {
            margin: 0;
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 700;
        }
        .edit-btn {
            background-color: #35373c;
            color: #b5bac1;
            border: 1px solid #4e5058;
            padding: 7px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .edit-btn:hover {
            background-color: #5865f2;
            color: white;
            border-color: #5865f2;
        }

        /* Pokemon List */
        .pokemon-list {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .pokemon-item {
            background: #1e1f22;
            padding: 10px 14px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2b2d31;
            transition: border-color 0.15s;
        }
        .pokemon-item:hover {
            border-color: #404249;
        }
        .pokemon-name {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            color: #f2f3f5;
        }
        .pokemon-name i {
            color: #ffcc01;
            font-size: 0.9rem;
        }
        .pokemon-item .level {
            background: rgba(88, 101, 242, 0.15);
            border: 1px solid rgba(88, 101, 242, 0.4);
            padding: 3px 10px;
            border-radius: 20px;
            color: #5865f2;
            font-weight: 700;
            font-size: 0.8rem;
        }
        .empty-msg {
            color: #80848e;
            font-size: 0.9rem;
            text-align: center;
            padding: 25px 0;
            border: 1px dashed #35363c;
            border-radius: 8px;
            background: rgba(0,0,0,0.1);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #313338;
            padding: 28px;
            border-radius: 12px;
            width: 90%;
            max-width: 460px;
            border: 1px solid #3f4147;
            box-shadow: 0 16px 32px rgba(0,0,0,0.5);
        }
        .modal-content h3 {
            margin: 0 0 18px 0;
            color: #fff;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal-content label {
            display: block;
            margin-bottom: 8px;
            color: #b5bac1;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .modal-content input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 16px;
            background: #1e1f22;
            border: 1px solid #3f4147;
            color: white;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .modal-content input:focus {
            border-color: #5865f2;
        }

        .edit-poke-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
        }
        .edit-poke-row input { margin: 0; }
        .btn-del {
            background: #da373c;
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-del:hover { background: #a1282b; }
        
        .btn-add {
            background: #2b2d31;
            color: #23a55a;
            border: 1px dashed #23a55a;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            margin: 8px 0 20px 0;
            font-weight: 700;
            transition: all 0.2s;
        }
        .btn-add:hover {
            background: rgba(35, 165, 90, 0.1);
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .modal-buttons button {
            padding: 9px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .btn-cancel { background: #4e5058; color: white; }
        .btn-cancel:hover { background: #6d6f78; }
        .btn-save { background: #5865f2; color: white; }
        .btn-save:hover { background: #4752c4; }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-gamepad"></i> 포켓몬 서버 프로필</h1>
        <p>멤버별 보유 포켓몬 및 레벨 관리 페이지</p>
    </header>

    <div class="container" id="profile-container"></div>

    <!-- 수정 모달 -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h3 id="modalTitle"><i class="fa-solid fa-user-pen"></i> 프로필 수정</h3>
            
            <!-- 1단계: 비밀번호 -->
            <div id="authSection">
                <label for="inputPassword">비밀번호 인증</label>
                <input type="password" id="inputPassword" placeholder="비밀번호를 입력하세요 (기본: 1234)">
                <div class="modal-buttons">
                    <button class="btn-cancel" onclick="closeModal()">취소</button>
                    <button class="btn-save" onclick="verifyPassword()">확인</button>
                </div>
            </div>

            <!-- 2단계: 포켓몬 수정 -->
            <div id="editSection" style="display:none;">
                <label>포켓몬 및 레벨 설정</label>
                <div id="pokeEditList" style="max-height: 260px; overflow-y: auto; padding-right: 4px;"></div>
                
                <button class="btn-add" onclick="addPokeInput()"><i class="fa-solid fa-plus"></i> 포켓몬 추가</button>

                <div class="modal-buttons">
                    <button class="btn-cancel" onclick="closeModal()">취소</button>
                    <button class="btn-save" style="background:#23a55a;" onclick="saveData()">저장하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 실제 Firebase 키 설정
        const firebaseConfig = {
            apiKey: "AIzaSyB...", 
            authDomain: "poketest-123.firebaseapp.com",
            projectId: "minecraft-poke-date",
            storageBucket: "poketest-123.appspot.com",
            messagingSenderId: "987654321",
            appId: "1:987654321:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const members = ["김민규", "권영재", "김주환", "장유성", "정세훈", "한승기"];
        let currentMember = "";
        let currentPokemonList = [];

        // 프로필 카드 로드
        window.loadProfiles = async function() {
            const container = document.getElementById("profile-container");
            container.innerHTML = "";

            for (const name of members) {
                let pokemonData = [];
                
                try {
                    const docRef = doc(db, "profiles", name);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        pokemonData = docSnap.data().pokemonList || [];
                    }
                } catch (e) {
                    console.log(`${name} 로딩 문제 (Firebase 키 확인 필요)`);
                }

                let pokemonHtml = pokemonData.map(p => 
                    `<div class="pokemon-item">
                        <span class="pokemon-name"><i class="fa-solid fa-bolt"></i> ${p.name}</span>
                        <span class="level">Lv.${p.level}</span>
                    </div>`
                ).join('');

                if (pokemonData.length === 0) {
                    pokemonHtml = `<div class="empty-msg"><i class="fa-regular fa-folder-open"></i> 등록된 포켓몬이 없습니다.</div>`;
                }

                const card = document.createElement("div");
                card.className = "profile-card";
                card.innerHTML = `
                    <div class="profile-header">
                        <div class="user-info">
                            <div class="avatar">${name.charAt(0)}</div>
                            <h2>${name}</h2>
                        </div>
                        <button class="edit-btn" onclick="openEditModal('${name}')"><i class="fa-solid fa-pen"></i> 수정</button>
                    </div>
                    <div class="pokemon-list">${pokemonHtml}</div>
                `;
                container.appendChild(card);
            }
        }

        // 모달 열기
        window.openEditModal = function(name) {
            currentMember = name;
            document.getElementById("modalTitle").innerHTML = `<i class="fa-solid fa-user-pen"></i> ${name} 프로필 수정`;
            document.getElementById("inputPassword").value = "";
            document.getElementById("authSection").style.display = "block";
            document.getElementById("editSection").style.display = "none";
            document.getElementById("editModal").style.display = "flex";
        }

        // 비밀번호 검증
        window.verifyPassword = async function() {
            const pwd = document.getElementById("inputPassword").value;
            let realPwd = "1234";

            try {
                const docRef = doc(db, "profiles", currentMember);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists() && docSnap.data().password) {
                    realPwd = docSnap.data().password;
                }
            } catch(e) {}

            if (pwd === realPwd) {
                document.getElementById("authSection").style.display = "none";
                document.getElementById("editSection").style.display = "block";
                fetchCurrentPokemon();
            } else {
                alert("비밀번호가 올바르지 않습니다.");
            }
        }

        async function fetchCurrentPokemon() {
            currentPokemonList = [];
            try {
                const docRef = doc(db, "profiles", currentMember);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    currentPokemonList = docSnap.data().pokemonList || [];
                }
            } catch(e) {}
            renderEditList();
        }

        function renderEditList() {
            const listDiv = document.getElementById("pokeEditList");
            listDiv.innerHTML = "";

            currentPokemonList.forEach((p, idx) => {
                const row = document.createElement("div");
                row.className = "edit-poke-row";
                row.innerHTML = `
                    <input type="text" value="${p.name}" placeholder="포켓몬 이름" onchange="updateTempData(${idx}, 'name', this.value)" style="flex:2;">
                    <input type="number" value="${p.level}" placeholder="레벨" onchange="updateTempData(${idx}, 'level', this.value)" style="flex:1;">
                    <button class="btn-del" onclick="removePokeInput(${idx})"><i class="fa-solid fa-trash"></i></button>
                `;
                listDiv.appendChild(row);
            });
        }

        window.updateTempData = function(idx, key, val) {
            if (key === 'level') val = Number(val);
            currentPokemonList[idx][key] = val;
        }

        window.addPokeInput = function() {
            currentPokemonList.push({ name: "", level: 1 });
            renderEditList();
        }

        window.removePokeInput = function(idx) {
            currentPokemonList.splice(idx, 1);
            renderEditList();
        }

        window.saveData = async function() {
            const cleanedList = currentPokemonList.filter(p => p.name.trim() !== "");

            try {
                const docRef = doc(db, "profiles", currentMember);
                await setDoc(docRef, { 
                    password: "1234", 
                    pokemonList: cleanedList 
                }, { merge: true });

                alert("저장되었습니다!");
                closeModal();
                loadProfiles();
            } catch(e) {
                alert("저장 실패: Firebase 설정을 확인해주세요.");
            }
        }

        window.closeModal = function() {
            document.getElementById("editModal").style.display = "none";
        }

        loadProfiles();
    </script>
</body>
</html>
