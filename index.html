<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포켓몬 마크 서버 대시보드</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #0f1015;
            color: #f0f2f5;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* Header */
        header {
            background: rgba(22, 24, 31, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #e3350d;
            padding: 18px 20px 0 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-title { text-align: center; margin-bottom: 18px; }
        .header-title h1 {
            color: #ffffff;
            font-size: 1.8rem;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 900;
        }
        .pokeball-icon {
            width: 28px; height: 28px;
            background: linear-gradient(180deg, #e3350d 50%, #ffffff 50%);
            border-radius: 50%;
            border: 2px solid #000;
            position: relative;
            box-shadow: 0 0 10px rgba(227, 53, 13, 0.5);
            animation: spin 6s linear infinite;
        }
        .pokeball-icon::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 8px; height: 8px;
            background: #fff;
            border: 2px solid #000;
            border-radius: 50%;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 6px;
            max-width: 1200px;
            margin: 0 auto;
            overflow-x: auto;
        }
        .tab-btn {
            background: transparent;
            color: #9095a0;
            border: none;
            padding: 12px 18px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .tab-btn:hover { color: #ffffff; }
        .tab-btn.active {
            color: #ffcb05;
            border-bottom-color: #ffcb05;
            text-shadow: 0 0 8px rgba(255, 203, 5, 0.3);
        }

        /* Container */
        .main-container { max-width: 1200px; margin: 25px auto; padding: 0 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Banner */
        .hero-banner {
            background: linear-gradient(135deg, rgba(227, 53, 13, 0.15) 0%, rgba(255, 203, 5, 0.1) 100%), #171920;
            border: 1px solid rgba(227, 53, 13, 0.3);
            border-radius: 16px;
            padding: 24px 30px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        .hero-text h2 { margin: 0 0 8px 0; color: #ffffff; font-size: 1.5rem; font-weight: 800; }
        .hero-text p { margin: 0; color: #a0a5b1; font-size: 0.9rem; }
        .stat-badges { display: flex; gap: 12px; }
        .stat-card {
            background: #0f1015;
            border: 1px solid #2a2e39;
            border-radius: 10px;
            padding: 10px 18px;
            text-align: center;
            min-width: 100px;
        }
        .stat-card .num { font-size: 1.3rem; font-weight: 900; color: #ffcb05; }
        .stat-card .label { font-size: 0.78rem; color: #808592; }

        /* Quick Grid */
        .quick-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            margin-bottom: 25px;
        }
        .quick-card {
            background: #171920;
            border: 1px solid #282c37;
            border-radius: 12px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .quick-card:hover {
            border-color: #ffcb05;
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
        }
        .quick-card h3 { margin: 0 0 8px 0; color: #fff; display: flex; align-items: center; gap: 8px; font-size: 1.05rem; }
        .quick-card p { margin: 0; color: #8a8f9d; font-size: 0.85rem; }

        /* Section Title */
        .section-title { color: #ffffff; font-size: 1.25rem; margin: 25px 0 15px 0; display: flex; align-items: center; gap: 10px; font-weight: 800; }

        /* Profiles Grid */
        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
        }
        
        .profile-card {
            background: #171920;
            border: 1px solid #282c37;
            border-radius: 14px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .profile-card-line {
            position: absolute;
            top: 0; left: 0; width: 5px; height: 100%;
        }
        .profile-card:hover {
            transform: translateY(-5px);
            border-color: var(--theme-color, #ffcb05);
            box-shadow: 0 0 18px var(--theme-shadow, rgba(255, 203, 5, 0.35));
        }
        
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar {
            width: 42px; height: 42px;
            background: var(--theme-gradient, linear-gradient(135deg, #e3350d, #ffcb05));
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; color: #111; font-size: 1.15rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .user-name { font-size: 1.1rem; font-weight: 800; color: white; }
        .mc-name { font-size: 0.78rem; color: #23a55a; font-weight: bold; margin-top: 2px; }
        .poke-badge {
            font-size: 0.8rem;
            color: var(--theme-color, #ffcb05);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--theme-color, #ffcb05);
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 700;
        }
        .card-preview {
            background: #0f1015;
            padding: 10px 12px;
            border-radius: 8px;
            color: #a0a5b1;
            font-size: 0.85rem;
            border: 1px solid #222631;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 스타팅 포켓몬 이미지 배지 디자인 */
        .starter-badge {
            color: #ffcb05; font-size: 0.8rem; font-weight: bold; display: flex; align-items: center; gap: 5px;
            background: rgba(255, 203, 5, 0.1); padding: 3px 8px; border-radius: 6px; border: 1px solid rgba(255, 203, 5, 0.2);
        }
        .starter-badge img {
            width: 22px; height: 22px; object-fit: contain;
        }

        /* Commands, Rules, Locations Cards */
        .cmd-grid, .rules-list, .location-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .cmd-card, .rule-card, .location-card { background: #171920; border: 1px solid #282c37; border-radius: 12px; padding: 16px; }
        .cmd-code {
            background: #0f1015; color: #ffcb05; padding: 10px 12px; border-radius: 8px;
            font-family: monospace; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #222631; margin-bottom: 8px;
        }
        .rule-card { border-left: 4px solid #e3350d; }
        .rule-card i { color: #e3350d; font-size: 1.2rem; }
        .loc-coords { color: #23a55a; font-family: monospace; font-weight: bold; }
        .copy-btn { background: none; border: none; color: #808592; cursor: pointer; transition: color 0.2s; }
        .copy-btn:hover { color: #fff; }

        /* MODAL STYLES */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #171920;
            padding: 26px;
            border-radius: 16px;
            width: 95%;
            max-width: 620px;
            border: 1px solid #2d3240;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #282c37;
            padding-bottom: 14px;
            margin-bottom: 18px;
        }
        .modal-header h3 { margin: 0; color: white; font-size: 1.2rem; font-weight: 800; }
        
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .btn-mini-edit {
            background: #252833; color: #b0b5c0; border: 1px solid #3b4050; padding: 6px 12px;
            border-radius: 6px; font-size: 0.82rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; gap: 6px;
        }
        .btn-mini-edit:hover { background: #e3350d; color: #fff; border-color: #e3350d; }
        .close-btn { background: none; border: none; color: #808592; font-size: 1.3rem; cursor: pointer; }

        .poke-detail-item {
            background: #0f1015; padding: 10px 16px; border-radius: 8px; display: flex;
            justify-content: space-between; align-items: center; margin-bottom: 8px; border: 1px solid #222631;
        }
        .poke-info-left {
            display: flex; align-items: center; gap: 12px;
        }
        .poke-img {
            width: 45px; height: 45px; object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        .poke-detail-item .level {
            background: rgba(227, 53, 13, 0.15); color: #e3350d; border: 1px solid rgba(227, 53, 13, 0.3);
            padding: 3px 10px; border-radius: 12px; font-weight: 800; font-size: 0.85rem;
        }

        .input-group { margin-bottom: 14px; }
        .input-group label { display: block; color: #a0a5b1; font-size: 0.82rem; font-weight: bold; margin-bottom: 6px; }
        .form-input {
            width: 100%; background: #0f1015; border: 1px solid #2d3240; color: white; padding: 10px 12px;
            border-radius: 6px; font-size: 0.9rem; outline: none;
        }
        .form-input:focus { border-color: #ffcb05; }

        .edit-poke-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .edit-poke-row input {
            background: #0f1015; border: 1px solid #2d3240; color: white; padding: 10px;
            border-radius: 6px; font-size: 0.9rem; outline: none;
        }
        .edit-poke-row input:focus { border-color: #ffcb05; }

        .color-picker { display: flex; gap: 10px; margin-top: 6px; }
        .color-option {
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid transparent;
            transition: transform 0.2s;
        }
        .color-option:hover { transform: scale(1.15); }
        .color-option.selected { border-color: #ffffff; box-shadow: 0 0 8px rgba(255,255,255,0.8); }

        .btn-action {
            width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 0.95rem;
        }
        .btn-save { background: #23a55a; color: white; }
        .btn-del { background: #da373c; color: white; border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1><div class="pokeball-icon"></div> 포켓몬 마크 서버</h1>
        </div>
        <div class="nav-tabs">
            <button class="tab-btn active" id="btn-home" onclick="switchTab('home')"><i class="fa-solid fa-house"></i> 메인 (홈)</button>
            <button class="tab-btn" id="btn-profiles" onclick="switchTab('profiles')"><i class="fa-solid fa-id-card"></i> 프로필</button>
            <button class="tab-btn" id="btn-commands" onclick="switchTab('commands')"><i class="fa-solid fa-terminal"></i> 명령어</button>
            <button class="tab-btn" id="btn-rules" onclick="switchTab('rules')"><i class="fa-solid fa-scroll"></i> 서버 규칙</button>
            <button class="tab-btn" id="btn-locations" onclick="switchTab('locations')"><i class="fa-solid fa-map-location-dot"></i> 주요 좌표</button>
        </div>
    </header>

    <div class="main-container">
        <!-- 0. 메인 홈 탭 -->
        <div id="tab-home" class="tab-content active">
            <div class="hero-banner">
                <div class="hero-text">
                    <h2>⚡ 포켓몬 서버 정보센터</h2>
                    <p>멤버들의 포켓몬 라인업과 서버 주요 좌표/명령어를 확인하세요.</p>
                </div>
                <div class="stat-badges">
                    <div class="stat-card"><div class="num">6명</div><div class="label">서버 멤버</div></div>
                    <div class="stat-card"><div class="num" id="total-poke-count">0</div><div class="label">총 보유 수</div></div>
                </div>
            </div>

            <div class="quick-grid">
                <div class="quick-card" onclick="switchTab('commands')">
                    <h3><i class="fa-solid fa-terminal" style="color:#ffcb05;"></i> 주요 명령어</h3>
                    <p>스폰 확률, IV/EV 개체값 확인 명령어</p>
                </div>
                <div class="quick-card" onclick="switchTab('rules')">
                    <h3><i class="fa-solid fa-ban" style="color:#e3350d;"></i> 서버 금지 규칙</h3>
                    <p>TP, 인벤세이브, 포켓힐 등 제한사항 보기</p>
                </div>
                <div class="quick-card" onclick="switchTab('locations')">
                    <h3><i class="fa-solid fa-location-dot" style="color:#23a55a;"></i> 핵심 위치 좌표</h3>
                    <p>체육관, 신전, 기술할배 위치 안내</p>
                </div>
            </div>

            <div class="section-title"><i class="fa-solid fa-users"></i> 멤버 프로필 (클릭하여 확인)</div>
            <div class="profile-grid" id="home-profile-container"></div>
        </div>

        <!-- 1. 전체 프로필 탭 -->
        <div id="tab-profiles" class="tab-content">
            <div class="section-title"><i class="fa-solid fa-users"></i> 전체 멤버 프로필</div>
            <div class="profile-grid" id="profile-container"></div>
        </div>

        <!-- 2. 명령어 탭 -->
        <div id="tab-commands" class="tab-content">
            <div class="section-title"><i class="fa-solid fa-terminal"></i> 서버 명령어 모음</div>
            <div class="cmd-grid" id="cmd-container"></div>
        </div>

        <!-- 3. 규칙 탭 -->
        <div id="tab-rules" class="tab-content">
            <div class="section-title"><i class="fa-solid fa-scroll"></i> 서버 규칙 및 조건</div>
            <div class="rules-list" id="rules-container"></div>
        </div>

        <!-- 4. 좌표 탭 -->
        <div id="tab-locations" class="tab-content">
            <div class="section-title"><i class="fa-solid fa-map-location-dot"></i> 주요 좌표 목록</div>
            <div class="location-grid" id="location-container"></div>
        </div>
    </div>

    <!-- 상세 프로필 모달 -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h3 id="detailTitle" style="margin-bottom: 2px;">멤버 프로필</h3>
                    <div id="detailMcName" style="color:#23a55a; font-size:0.85rem; font-weight:bold;"></div>
                </div>
                <div class="header-actions">
                    <button class="btn-mini-edit" onclick="openAuthModal()"><i class="fa-solid fa-pen"></i> 프로필 수정</button>
                    <button class="close-btn" onclick="closeModal('detailModal')"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>

            <div id="detailStarter" style="margin-bottom: 12px; display:none;"></div>

            <div id="detailList" style="max-height: 380px; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- 수정 모달 -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="editTitle">프로필 수정</h3>
                <button class="close-btn" onclick="closeModal('editModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div id="authSection">
                <p style="color:#8a8f9d; font-size:0.85rem; margin-top:0;">수정 권한을 확인하기 위해 비밀번호를 입력하세요.</p>
                <input type="password" id="inputPassword" class="form-input" placeholder="비밀번호 입력 (기본: 1234)">
                <button class="btn-action btn-save" onclick="verifyPassword()">인증 확인</button>
            </div>

            <div id="editSection" style="display:none;">
                <div class="input-group">
                    <label>마인크래프트 닉네임</label>
                    <input type="text" id="editMcName" class="form-input" placeholder="예: Mango_123">
                </div>

                <div class="input-group">
                    <label>스타팅 포켓몬 선택/입력</label>
                    <input type="text" id="editStarter" class="form-input" placeholder="예: 브케인, 파이리, 이상해씨, 꼬부기, 피카츄 등">
                </div>

                <div class="input-group">
                    <label>비밀번호 변경</label>
                    <input type="password" id="editPassword" class="form-input" placeholder="새 비밀번호">
                </div>

                <div class="input-group">
                    <label>카드 테두리 그라데이션 & 네온 테마 선택</label>
                    <div class="color-picker" id="colorPicker">
                        <div class="color-option" data-color="yellow-red" style="background: linear-gradient(180deg, #ffcb05, #e3350d);" onclick="selectColorTheme('yellow-red')"></div>
                        <div class="color-option" data-color="blue-purple" style="background: linear-gradient(180deg, #00a8fc, #5865f2);" onclick="selectColorTheme('blue-purple')"></div>
                        <div class="color-option" data-color="green-mint" style="background: linear-gradient(180deg, #23a55a, #00f2fe);" onclick="selectColorTheme('green-mint')"></div>
                        <div class="color-option" data-color="pink-orange" style="background: linear-gradient(180deg, #ff0844, #ffb199);" onclick="selectColorTheme('pink-orange')"></div>
                        <div class="color-option" data-color="gold-neon" style="background: linear-gradient(180deg, #f6d365, #fda085);" onclick="selectColorTheme('gold-neon')"></div>
                    </div>
                </div>

                <div class="input-group" style="margin-top: 20px;">
                    <label>보유 포켓몬 및 레벨 수정</label>
                    <div id="pokeEditList" style="max-height: 200px; overflow-y: auto;"></div>
                    <button onclick="addPokeInput()" style="width:100%; background:none; border:1px dashed #23a55a; color:#23a55a; padding:10px; border-radius:6px; margin-top:8px; font-weight:bold; cursor:pointer;">+ 포켓몬 추가</button>
                </div>

                <button class="btn-action btn-save" onclick="saveData()">최종 저장하기</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB...", 
            authDomain: "poketest-123.firebaseapp.com",
            projectId: "minecraft-poke-date",
            storageBucket: "poketest-123.appspot.com",
            messagingSenderId: "987654321",
            appId: "1:987654321:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const members = ["민규", "영재", "주환", "유성", "세훈", "승기"];
        let currentMember = "";
        let currentPokemonList = [];
        let currentMemberData = {};
        let selectedTheme = "yellow-red";

        // 🔥 보강된 포켓몬 한글 이름 <-> 도감 번호 매핑 (브케인 155번 추가!) 🔥
        const pokeNumMap = {
            "이상해씨":1, "이상해풀":2, "이상해꽃":3, "파이리":4, "리자드":5, "리자몽":6,
            "꼬부기":7, "어니부기":8, "거북왕":9, "캐터피":10, "단데기":11, "버터플":12,
            "피카츄":25, "라이츄":26, "푸린":39, "고라파덕":54, "팬텀":94, "잉어킹":129, "갸라도스":130,
            "메타몽":132, "이브이":133, "브케인":155, "마그케인":156, "블레이범":157, "리아코":158, "치코리타":152,
            "나무지기":252, "아차모":255, "물짱이":258, "모부기":387, "불꽃숭이":390, "팽도리":393,
            "잠만보":143, "망나뇽":149, "뮤츠":150, "뮤":151, "세레비":251, "아르세우스":493
        };

        function getPokeImgUrl(name) {
            if (!name) return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png`;
            const cleanName = name.trim();
            const num = pokeNumMap[cleanName];
            if (num) {
                return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${num}.png`;
            }
            return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png`;
        }

        const themeStyles = {
            'yellow-red': { color: '#ffcb05', shadow: 'rgba(255, 203, 5, 0.4)', gradient: 'linear-gradient(180deg, #ffcb05, #e3350d)' },
            'blue-purple': { color: '#00a8fc', shadow: 'rgba(0, 168, 252, 0.4)', gradient: 'linear-gradient(180deg, #00a8fc, #5865f2)' },
            'green-mint': { color: '#00f2fe', shadow: 'rgba(0, 242, 254, 0.4)', gradient: 'linear-gradient(180deg, #23a55a, #00f2fe)' },
            'pink-orange': { color: '#ff0844', shadow: 'rgba(255, 8, 68, 0.4)', gradient: 'linear-gradient(180deg, #ff0844, #ffb199)' },
            'gold-neon': { color: '#f6d365', shadow: 'rgba(246, 211, 101, 0.4)', gradient: 'linear-gradient(180deg, #f6d365, #fda085)' }
        };

        const commandsData = [
            { cmd: "/checkspawns", desc: "일반 포켓몬 스폰 확률 확인" },
            { cmd: "/checkspawns legendary", desc: "전설 포켓몬 스폰 확률 확인" },
            { cmd: "/ivs (슬롯번호)", desc: "포켓몬 개체값 확인" },
            { cmd: "/evs (슬롯번호)", desc: "포켓몬 노력치 확인" },
            { cmd: "/effect give (본인닉) minecraft:saturation 999999 99", desc: "무한 배고픔 회복" },
            { cmd: "/effect give (본인닉) minecraft:night_vision 999999 99", desc: "무한 야간투시 버프" },
            { cmd: "/kill @e[type=item]", desc: "바닥 떨어진 아이템 전체 삭제" }
        ];

        const rulesData = [
            "tp 금지 (tp X)", "인벤 세이브 금지 (인벤세이브 X)", "포화 버프 금지 (포화 버프 X)",
            "포켓힐 금지 (포켓힐 X)", "물체육관 돈 복사 금지", "전설 포켓몬 10레벨 고정",
            "나갔다오기 컨 금지", "치료기 섬손곡괭이 수확 금지", "스타팅 랜덤 포켓몬 고정",
            "전설 포켓몬으로만 하늘 날기 가능 (일반포켓몬 X)", "전설 보스 확률 명령어 확인 금지"
        ];

        const locationsData = [
            { name: "기술 할배", coords: "968 ~ 8" }, { name: "드래곤 체육관", coords: "2665 78 194" },
            { name: "세레비 신전", coords: "739 68 22 / -3415 64 -244" }, { name: "썬더 스폰지", coords: "366 62 -198 / -1863 75 -884" },
            { name: "집 마을", coords: "-200 65 600" }, { name: "중간 마을 (기술할배 근처)", coords: "-7262 63 -1001" },
            { name: "아르세우스 신전", coords: "-17493 83 32 11" }, { name: "세렙 스폰지", coords: "9744 65 8968" }
        ];

        window.switchTab = function(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            const targetBtn = document.getElementById(`btn-${tabName}`);
            if(targetBtn) targetBtn.classList.add('active');
            
            const targetTab = document.getElementById(`tab-${tabName}`);
            if(targetTab) targetTab.classList.add('active');
        }

        window.loadProfiles = async function() {
            const homeContainer = document.getElementById("home-profile-container");
            const profileContainer = document.getElementById("profile-container");
            
            homeContainer.innerHTML = "";
            profileContainer.innerHTML = "";

            let totalPokes = 0;

            for (const name of members) {
                let pokemonData = [];
                let mcName = "";
                let starter = "";
                let theme = "yellow-red";

                try {
                    const docRef = doc(db, "profiles", name);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        pokemonData = data.pokemonList || [];
                        mcName = data.mcName || "";
                        starter = data.starter || "";
                        theme = data.theme || "yellow-red";
                    }
                } catch (e) {}

                totalPokes += pokemonData.length;

                const createCard = () => {
                    const card = document.createElement("div");
                    card.className = "profile-card";
                    card.onclick = () => openDetailModal(name, pokemonData, mcName, starter);
                    
                    const t = themeStyles[theme] || themeStyles['yellow-red'];

                    card.style.setProperty('--theme-color', t.color);
                    card.style.setProperty('--theme-shadow', t.shadow);
                    card.style.setProperty('--theme-gradient', t.gradient);

                    card.innerHTML = `
                        <div class="profile-card-line" style="background: ${t.gradient};"></div>
                        <div class="card-header">
                            <div class="user-info">
                                <div class="avatar">${name.charAt(0)}</div>
                                <div>
                                    <div class="user-name">${name}</div>
                                    ${mcName ? `<div class="mc-name">@${mcName}</div>` : ''}
                                </div>
                            </div>
                            <span class="poke-badge">${pokemonData.length} 마리</span>
                        </div>
                        <div class="card-preview">
                            <span>${pokemonData.length > 0 ? `대표: ${pokemonData[0].name} (Lv.${pokemonData[0].level})` : '포켓몬 없음'}</span>
                            ${starter ? `
                                <div class="starter-badge">
                                    <img src="${getPokeImgUrl(starter)}" alt="${starter}" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png'">
                                    <span>${starter}</span>
                                </div>` : ''}
                        </div>
                    `;
                    return card;
                };

                homeContainer.appendChild(createCard());
                profileContainer.appendChild(createCard());
            }

            document.getElementById("total-poke-count").innerText = `${totalPokes}마리`;
        }

        window.openDetailModal = function(name, pokemonList, mcName, starter) {
            currentMember = name;
            currentPokemonList = pokemonList;
            
            document.getElementById("detailTitle").innerText = `${name}님의 프로필`;
            document.getElementById("detailMcName").innerText = mcName ? `@${mcName}` : '';
            
            const starterDiv = document.getElementById("detailStarter");
            if (starter) {
                starterDiv.style.display = "block";
                starterDiv.innerHTML = `
                    <div style="display:inline-flex; align-items:center; gap:8px; background:rgba(255, 203, 5, 0.15); border:1px solid #ffcb05; color:#ffcb05; padding:6px 14px; border-radius:20px; font-size:0.85rem; font-weight:bold;">
                        <img src="${getPokeImgUrl(starter)}" style="width:24px; height:24px; object-fit:contain;" alt="${starter}">
                        <span>스타팅 포켓몬: ${starter}</span>
                    </div>`;
            } else {
                starterDiv.style.display = "none";
            }

            const listDiv = document.getElementById("detailList");
            if (pokemonList.length === 0) {
                listDiv.innerHTML = `<p style="color:#8a8f9d; text-align:center; padding:30px 0;">등록된 포켓몬이 없습니다.</p>`;
            } else {
                listDiv.innerHTML = pokemonList.map(p => `
                    <div class="poke-detail-item">
                        <div class="poke-info-left">
                            <img class="poke-img" src="${getPokeImgUrl(p.name)}" alt="${p.name}" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png'">
                            <span style="font-weight:bold; color:white; font-size:0.95rem;">${p.name}</span>
                        </div>
                        <span class="level">Lv.${p.level}</span>
                    </div>
                `).join('');
            }
            document.getElementById("detailModal").style.display = "flex";
        }

        window.openAuthModal = function() {
            closeModal('detailModal');
            document.getElementById("editTitle").innerText = `${currentMember} 프로필 수정`;
            document.getElementById("inputPassword").value = "";
            document.getElementById("authSection").style.display = "block";
            document.getElementById("editSection").style.display = "none";
            document.getElementById("editModal").style.display = "flex";
        }

        window.verifyPassword = async function() {
            const pwd = document.getElementById("inputPassword").value;
            let realPwd = "1234";

            try {
                const docRef = doc(db, "profiles", currentMember);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    currentMemberData = docSnap.data();
                    if (currentMemberData.password) realPwd = currentMemberData.password;
                }
            } catch(e) {}

            if (pwd === realPwd) {
                document.getElementById("authSection").style.display = "none";
                document.getElementById("editSection").style.display = "block";
                
                document.getElementById("editMcName").value = currentMemberData.mcName || "";
                document.getElementById("editStarter").value = currentMemberData.starter || "";
                document.getElementById("editPassword").value = realPwd;
                selectColorTheme(currentMemberData.theme || "yellow-red");
                
                renderEditList();
            } else {
                alert("비밀번호가 올바르지 않습니다.");
            }
        }

        window.selectColorTheme = function(themeName) {
            selectedTheme = themeName;
            document.querySelectorAll('.color-option').forEach(el => {
                if (el.getAttribute('data-color') === themeName) {
                    el.classList.add('selected');
                } else {
                    el.classList.remove('selected');
                }
            });
        }

        function renderEditList() {
            const listDiv = document.getElementById("pokeEditList");
            listDiv.innerHTML = "";

            currentPokemonList.forEach((p, idx) => {
                const row = document.createElement("div");
                row.className = "edit-poke-row";
                row.innerHTML = `
                    <input type="text" value="${p.name}" placeholder="포켓몬 이름" onchange="updateTempData(${idx}, 'name', this.value)" style="flex:2;">
                    <input type="number" value="${p.level}" placeholder="레벨" onchange="updateTempData(${idx}, 'level', this.value)" style="flex:1;">
                    <button class="btn-del" onclick="removePokeInput(${idx})"><i class="fa-solid fa-trash"></i></button>
                `;
                listDiv.appendChild(row);
            });
        }

        window.updateTempData = (idx, key, val) => {
            if (key === 'level') val = Number(val);
            currentPokemonList[idx][key] = val;
        };

        window.addPokeInput = () => {
            currentPokemonList.push({ name: "", level: 1 });
            renderEditList();
        };

        window.removePokeInput = (idx) => {
            currentPokemonList.splice(idx, 1);
            renderEditList();
        };

        window.saveData = async function() {
            const cleanedList = currentPokemonList.filter(p => p.name.trim() !== "");
            const newMcName = document.getElementById("editMcName").value.trim();
            const newStarter = document.getElementById("editStarter").value.trim();
            const newPassword = document.getElementById("editPassword").value.trim();

            try {
                const docRef = doc(db, "profiles", currentMember);
                await setDoc(docRef, { 
                    password: newPassword || "1234", 
                    mcName: newMcName,
                    starter: newStarter,
                    theme: selectedTheme,
                    pokemonList: cleanedList 
                }, { merge: true });

                alert("수정이 완료되었습니다!");
                closeModal('editModal');
                loadProfiles();
            } catch(e) {
                alert("저장 실패: Firebase 설정을 확인해주세요.");
            }
        }

        window.closeModal = (id) => { document.getElementById(id).style.display = "none"; };

        function renderCommands() {
            document.getElementById("cmd-container").innerHTML = commandsData.map(c => `
                <div class="cmd-card">
                    <div class="cmd-code">
                        <span>${c.cmd}</span>
                        <button class="copy-btn" onclick="copyText('${c.cmd}')"><i class="fa-regular fa-copy"></i></button>
                    </div>
                    <div style="color:#a0a5b1; font-size:0.85rem;">${c.desc}</div>
                </div>
            `).join('');
        }

        function renderRules() {
            document.getElementById("rules-container").innerHTML = rulesData.map(r => `
                <div class="rule-card">
                    <i class="fa-solid fa-ban"></i>
                    <div style="color:#fff; font-size:0.9rem;">${r}</div>
                </div>
            `).join('');
        }

        function renderLocations() {
            document.getElementById("location-container").innerHTML = locationsData.map(l => `
                <div class="location-card">
                    <div>
                        <h4 style="margin:0 0 4px 0; color:#fff;">${l.name}</h4>
                        <div class="loc-coords">${l.coords}</div>
                    </div>
                    <button class="copy-btn" onclick="copyText('${l.coords}')"><i class="fa-regular fa-copy"></i> 복사</button>
                </div>
            `).join('');
        }

        window.copyText = (text) => {
            navigator.clipboard.writeText(text);
            alert(`복사되었습니다: ${text}`);
        };

        loadProfiles();
        renderCommands();
        renderRules();
        renderLocations();
    </script>
</body>
</html>
