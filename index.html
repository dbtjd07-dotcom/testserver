<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포켓몬 서버 프로필 관리</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1f22;
            color: #dbdee1;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 30px;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .profile-card {
            background-color: #2b2d31;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3f4147;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .profile-header h2 {
            margin: 0;
            color: #5865f2;
            font-size: 1.3rem;
        }
        .edit-btn {
            background-color: #5865f2;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .edit-btn:hover { background-color: #4752c4; }
        .pokemon-list { flex-grow: 1; }
        .pokemon-item {
            background: #313338;
            padding: 10px 14px;
            margin: 6px 0;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pokemon-item .level {
            background: #232428;
            padding: 3px 8px;
            border-radius: 12px;
            color: #00a8fc;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .empty-msg {
            color: #949ba4;
            font-size: 0.9rem;
            text-align: center;
            padding: 15px 0;
        }

        /* 모달 스타일 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #313338;
            padding: 25px;
            border-radius: 8px;
            width: 90%;
            max-width: 450px;
        }
        .modal-content h3 { margin-top: 0; color: #fff; }
        .modal-content input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px 0;
            background: #1e1f22;
            border: 1px solid #3f4147;
            color: white;
            border-radius: 4px;
        }
        .edit-poke-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }
        .edit-poke-row input { margin: 0; }
        .btn-del {
            background: #da373c;
            color: white;
            border: none;
            padding: 8px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-add {
            background: #248046;
            color: white;
            border: none;
            padding: 8px;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 5px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .modal-buttons button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-cancel { background: #4e5058; color: white; }
        .btn-save { background: #5865f2; color: white; }
    </style>
</head>
<body>

    <h1>포켓몬 서버 멤버 프로필</h1>
    <div class="container" id="profile-container"></div>

    <!-- 비밀번호/수정 모달 -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h3 id="modalTitle">프로필 수정</h3>
            
            <!-- 1단계: 비밀번호 입력 -->
            <div id="authSection">
                <label>비밀번호 입력</label>
                <input type="password" id="inputPassword" placeholder="비밀번호 입력 (기본: 1234)">
                <div class="modal-buttons">
                    <button class="btn-cancel" onclick="closeModal()">취소</button>
                    <button class="btn-save" onclick="verifyPassword()">확인</button>
                </div>
            </div>

            <!-- 2단계: 포켓몬 개별 수정 -->
            <div id="editSection" style="display:none;">
                <label>보유 포켓몬 목록</label>
                <div id="pokeEditList" style="max-height: 250px; overflow-y: auto; margin-top: 8px;"></div>
                
                <button class="btn-add" onclick="addPokeInput()">+ 포켓몬 추가하기</button>

                <div class="modal-buttons">
                    <button class="btn-cancel" onclick="closeModal()">취소</button>
                    <button class="btn-save" style="background:#248046;" onclick="saveData()">저장</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK 모듈 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ⭕ 수정 후 (본인 Firebase 값으로 교체)
        const firebaseConfig = {
            apiKey: "AIzaSyB...", // 본인 실제 API Key
            authDomain: "poketest-123.firebaseapp.com",
            projectId: "minecraft-poke-date",
            storageBucket: "poketest-123.appspot.com",
            messagingSenderId: "987654321",
            appId: "1:987654321:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 고정된 6명 프로필 데이터베이스 구조
        const members = ["김민규", "권영재", "김주환", "장유성", "정세훈", "한승기"];
        let currentMember = "";
        let currentPokemonList = [];

        // 프로필 화면 표시
        window.loadProfiles = async function() {
            const container = document.getElementById("profile-container");
            container.innerHTML = "";

            for (const name of members) {
                let pokemonData = [];
                
                try {
                    const docRef = doc(db, "profiles", name);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        pokemonData = docSnap.data().pokemonList || [];
                    }
                } catch (e) {
                    console.log(`${name} 데이터 로드 중 (Firebase 키 확인 필요)`);
                }

                let pokemonHtml = pokemonData.map(p => 
                    `<div class="pokemon-item">
                        <span>${p.name}</span>
                        <span class="level">Lv.${p.level}</span>
                    </div>`
                ).join('');

                if (pokemonData.length === 0) {
                    pokemonHtml = `<div class="empty-msg">등록된 포켓몬이 없습니다.</div>`;
                }

                const card = document.createElement("div");
                card.className = "profile-card";
                card.innerHTML = `
                    <div class="profile-header">
                        <h2>${name}</h2>
                        <button class="edit-btn" onclick="openEditModal('${name}')">수정</button>
                    </div>
                    <div class="pokemon-list">${pokemonHtml}</div>
                `;
                container.appendChild(card);
            }
        }

        // 모달 열기
        window.openEditModal = function(name) {
            currentMember = name;
            document.getElementById("modalTitle").innerText = `${name} 프로필 수정`;
            document.getElementById("inputPassword").value = "";
            document.getElementById("authSection").style.display = "block";
            document.getElementById("editSection").style.display = "none";
            document.getElementById("editModal").style.display = "flex";
        }

        // 비밀번호 확인
        window.verifyPassword = async function() {
            const pwd = document.getElementById("inputPassword").value;
            let realPwd = "1234"; // 기본 비밀번호

            try {
                const docRef = doc(db, "profiles", currentMember);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists() && docSnap.data().password) {
                    realPwd = docSnap.data().password;
                }
            } catch(e) {}

            if (pwd === realPwd) {
                document.getElementById("authSection").style.display = "none";
                document.getElementById("editSection").style.display = "block";
                fetchCurrentPokemon();
            } else {
                alert("비밀번호가 일치하지 않습니다!");
            }
        }

        // 현재 포켓몬 수정 리스트 불러오기
        async function fetchCurrentPokemon() {
            currentPokemonList = [];
            try {
                const docRef = doc(db, "profiles", currentMember);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    currentPokemonList = docSnap.data().pokemonList || [];
                }
            } catch(e) {}
            renderEditList();
        }

        // 수정용 입력창 인퍼페이스 생성
        function renderEditList() {
            const listDiv = document.getElementById("pokeEditList");
            listDiv.innerHTML = "";

            currentPokemonList.forEach((p, idx) => {
                const row = document.createElement("div");
                row.className = "edit-poke-row";
                row.innerHTML = `
                    <input type="text" value="${p.name}" placeholder="포켓몬 이름" onchange="updateTempData(${idx}, 'name', this.value)" style="flex:2;">
                    <input type="number" value="${p.level}" placeholder="레벨" onchange="updateTempData(${idx}, 'level', this.value)" style="flex:1;">
                    <button class="btn-del" onclick="removePokeInput(${idx})">삭제</button>
                `;
                listDiv.appendChild(row);
            });
        }

        window.updateTempData = function(idx, key, val) {
            if (key === 'level') val = Number(val);
            currentPokemonList[idx][key] = val;
        }

        window.addPokeInput = function() {
            currentPokemonList.push({ name: "", level: 1 });
            renderEditList();
        }

        window.removePokeInput = function(idx) {
            currentPokemonList.splice(idx, 1);
            renderEditList();
        }

        // Firestore DB에 최종 저장
        window.saveData = async function() {
            // 빈 이름 제외 필터링
            const cleanedList = currentPokemonList.filter(p => p.name.trim() !== "");

            try {
                const docRef = doc(db, "profiles", currentMember);
                await setDoc(docRef, { 
                    password: "1234", 
                    pokemonList: cleanedList 
                }, { merge: true });

                alert("저장되었습니다!");
                closeModal();
                loadProfiles();
            } catch(e) {
                alert("저장 실패: Firebase 설정(YOUR_PROJECT_ID)과 Rules를 확인해주세요.");
                console.error(e);
            }
        }

        window.closeModal = function() {
            document.getElementById("editModal").style.display = "none";
        }

        // 실행
        loadProfiles();
    </script>
</body>
</html>
