<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포켓몬 서버 통합 대시보드</title>
    <!-- Google Fonts & FontAwesome 아이콘 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', 'Segoe UI', sans-serif;
            background: #111214;
            color: #dbdee1;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* Header & Navigation */
        header {
            background: #2b2d31;
            border-bottom: 1px solid #35363c;
            padding: 20px 20px 0 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-title {
            text-align: center;
            margin-bottom: 20px;
        }
        .header-title h1 {
            color: #ffffff;
            font-size: 1.8rem;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .header-title h1 i { color: #ffcb05; }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            max-width: 1200px;
            margin: 0 auto;
            overflow-x: auto;
        }
        .tab-btn {
            background: transparent;
            color: #949ba4;
            border: none;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .tab-btn:hover {
            color: #dbdee1;
        }
        .tab-btn.active {
            color: #5865f2;
            border-bottom-color: #5865f2;
        }

        /* Main Content Container */
        .main-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* 1. 멤버 프로필 섹션 */
        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .profile-card {
            background: #2b2d31;
            border: 1px solid #35363c;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .profile-card:hover {
            transform: translateY(-4px);
            border-color: #5865f2;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #5865f2, #eb459e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 1.2rem;
        }
        .user-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
        }
        .poke-count {
            font-size: 0.85rem;
            color: #5865f2;
            background: rgba(88, 101, 242, 0.15);
            padding: 4px 10px;
            border-radius: 15px;
            font-weight: 600;
        }
        .card-preview {
            background: #1e1f22;
            padding: 12px;
            border-radius: 8px;
            color: #949ba4;
            font-size: 0.9rem;
        }

        /* 2. 명령어 섹션 */
        .cmd-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 16px;
        }
        .cmd-card {
            background: #2b2d31;
            border: 1px solid #35363c;
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .cmd-code {
            background: #1e1f22;
            color: #00a8fc;
            padding: 10px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #3f4147;
        }
        .cmd-copy-btn {
            background: none;
            border: none;
            color: #949ba4;
            cursor: pointer;
            transition: color 0.2s;
        }
        .cmd-copy-btn:hover { color: white; }
        .cmd-desc {
            color: #dbdee1;
            font-size: 0.9rem;
        }

        /* 3. 조건(규칙) 섹션 */
        .rules-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
        }
        .rule-card {
            background: #2b2d31;
            border-left: 4px solid #da373c;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .rule-card i {
            color: #da373c;
            font-size: 1.4rem;
        }
        .rule-text {
            color: #ffffff;
            font-weight: 500;
            font-size: 0.95rem;
        }

        /* 4. 위치(좌표) 섹션 */
        .location-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 16px;
        }
        .location-card {
            background: #2b2d31;
            border: 1px solid #35363c;
            border-radius: 10px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .loc-info h4 {
            margin: 0 0 6px 0;
            color: #ffffff;
            font-size: 1.05rem;
        }
        .loc-coords {
            color: #23a55a;
            font-family: monospace;
            font-size: 0.95rem;
            font-weight: bold;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #313338;
            padding: 26px;
            border-radius: 12px;
            width: 90%;
            max-width: 480px;
            border: 1px solid #3f4147;
            box-shadow: 0 16px 32px rgba(0,0,0,0.5);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3f4147;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .modal-header h3 { margin: 0; color: white; }
        .close-btn {
            background: none;
            border: none;
            color: #949ba4;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .poke-detail-item {
            background: #1e1f22;
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .poke-detail-item .level {
            background: rgba(88, 101, 242, 0.2);
            color: #5865f2;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .edit-poke-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .edit-poke-row input {
            background: #1e1f22;
            border: 1px solid #3f4147;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
        }
        .btn-action {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-edit { background: #5865f2; color: white; }
        .btn-save { background: #23a55a; color: white; }
        .btn-del { background: #da373c; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1><i class="fa-solid fa-gamepad"></i> 포켓몬 서버 대시보드</h1>
        </div>
        <!-- 탭 카테고리 메뉴 -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('profiles')"><i class="fa-solid fa-users"></i> 프로필 (멤버)</button>
            <button class="tab-btn" onclick="switchTab('commands')"><i class="fa-solid fa-terminal"></i> 명령어 모음</button>
            <button class="tab-btn" onclick="switchTab('rules')"><i class="fa-solid fa-scroll"></i> 서버 규칙 (조건)</button>
            <button class="tab-btn" onclick="switchTab('locations')"><i class="fa-solid fa-map-location-dot"></i> 주요 좌표 (위치)</button>
        </div>
    </header>

    <div class="main-container">
        <!-- 1. 프로필 탭 -->
        <div id="tab-profiles" class="tab-content active">
            <div class="profile-grid" id="profile-container"></div>
        </div>

        <!-- 2. 명령어 탭 -->
        <div id="tab-commands" class="tab-content">
            <div class="cmd-grid" id="cmd-container"></div>
        </div>

        <!-- 3. 조건(규칙) 탭 -->
        <div id="tab-rules" class="tab-content">
            <div class="rules-list" id="rules-container"></div>
        </div>

        <!-- 4. 위치(좌표) 탭 -->
        <div id="tab-locations" class="tab-content">
            <div class="location-grid" id="location-container"></div>
        </div>
    </div>

    <!-- 상세정보 보기 모달 -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="detailTitle">멤버 정보</h3>
                <button class="close-btn" onclick="closeModal('detailModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="detailList" style="max-height: 300px; overflow-y: auto;"></div>
            <button class="btn-action btn-edit" onclick="openAuthModal()"><i class="fa-solid fa-pen"></i> 수정하기 (비밀번호 필요)</button>
        </div>
    </div>

    <!-- 수정 인증 및 수정하기 모달 -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="editTitle">프로필 수정</h3>
                <button class="close-btn" onclick="closeModal('editModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div id="authSection">
                <p style="color:#b5bac1; font-size:0.9rem;">수정하려면 비밀번호를 입력해주세요.</p>
                <input type="password" id="inputPassword" placeholder="비밀번호 (기본: 1234)" style="width:100%; padding:10px; background:#1e1f22; border:1px solid #3f4147; color:white; border-radius:6px; margin-bottom:15px;">
                <button class="btn-action btn-edit" onclick="verifyPassword()">인증 확인</button>
            </div>

            <div id="editSection" style="display:none;">
                <div id="pokeEditList" style="max-height: 250px; overflow-y: auto;"></div>
                <button onclick="addPokeInput()" style="width:100%; background:none; border:1px dashed #23a55a; color:#23a55a; padding:8px; border-radius:6px; margin:10px 0; font-weight:bold; cursor:pointer;">+ 포켓몬 추가</button>
                <button class="btn-action btn-save" onclick="saveData()">저장하기</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB...", 
            authDomain: "poketest-123.firebaseapp.com",
            projectId: "minecraft-poke-date",
            storageBucket: "poketest-123.appspot.com",
            messagingSenderId: "987654321",
            appId: "1:987654321:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const members = ["김민규", "권영재", "김주환", "장유성", "정세훈", "한승기"];
        let currentMember = "";
        let currentPokemonList = [];

        // 디스코드에서 추출한 카테고리 데이터
        const commandsData = [
            { cmd: "/checkspawns", desc: "일반 포켓몬 가능한 스폰 확률 보기" },
            { cmd: "/checkspawns legendary", desc: "전설 포켓몬 가능한 스폰 확률 보기" },
            { cmd: "/ivs (슬롯번호)", desc: "포켓몬 개체값 확인" },
            { cmd: "/evs (슬롯번호)", desc: "포켓몬 노력치 확인" },
            { cmd: "/effect give (본인닉) minecraft:saturation 999999 99", desc: "배고픔 안다는 명령어" },
            { cmd: "/effect give (본인닉) minecraft:night_vision 999999 99", desc: "야간투시 명령어" },
            { cmd: "/kill @e[type=item]", desc: "바닥에 떨어진 아이템 지우는 명령어" }
        ];

        const rulesData = [
            "tp 금지 (tp X)",
            "인벤 세이브 금지 (인벤세이브 X)",
            "포화 버프 금지 (포화 버프 X)",
            "포켓힐 금지 (포켓힐 X)",
            "물체육관에서 돈 복사 금지",
            "전설 포켓몬 10레벨로 고정",
            "나갔다오기 컨 금지",
            "치료기 섬손곡괭이로 캐는 거 금지",
            "스타팅 랜덤 포켓몬 고정",
            "전설 포켓몬으로만 하늘 날 수 있음 (일반 포켓몬 하늘날기 X)",
            "전설 보스 확률 명령어 확인 금지"
        ];

        const locationsData = [
            { name: "기술 할배", coords: "968 ~ 8" },
            { name: "드래곤 체육관", coords: "2665 78 194" },
            { name: "세레비 신전", coords: "739 68 22 / -3415 64 -244" },
            { name: "썬더 스폰지", coords: "366 62 -198 / -1863 75 -884" },
            { name: "집 마을", coords: "-200 65 600" },
            { name: "중간 마을 (기술할배 주변)", coords: "-7262 63 -1001" },
            { name: "아르세우스 신전", coords: "-17493 83 32 11" },
            { name: "세렙 스폰지", coords: "9744 65 8968" }
        ];

        // 탭 전환 함수
        window.switchTab = function(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.currentTarget.classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        // 1. 프로필 로드
        window.loadProfiles = async function() {
            const container = document.getElementById("profile-container");
            container.innerHTML = "";

            for (const name of members) {
                let pokemonData = [];
                try {
                    const docRef = doc(db, "profiles", name);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        pokemonData = docSnap.data().pokemonList || [];
                    }
                } catch (e) {}

                const card = document.createElement("div");
                card.className = "profile-card";
                card.onclick = () => openDetailModal(name, pokemonData);
                card.innerHTML = `
                    <div class="card-header">
                        <div class="user-info">
                            <div class="avatar">${name.charAt(0)}</div>
                            <div class="user-name">${name}</div>
                        </div>
                        <span class="poke-count">${pokemonData.length} 마리</span>
                    </div>
                    <div class="card-preview">
                        ${pokemonData.length > 0 ? `대표: ${pokemonData[0].name} (Lv.${pokemonData[0].level})` : '보유한 포켓몬이 없습니다.'}
                    </div>
                `;
                container.appendChild(card);
            }
        }

        // 상세 모달 열기
        window.openDetailModal = function(name, pokemonList) {
            currentMember = name;
            currentPokemonList = pokemonList;
            document.getElementById("detailTitle").innerText = `${name}님의 정보`;
            
            const listDiv = document.getElementById("detailList");
            if (pokemonList.length === 0) {
                listDiv.innerHTML = `<p style="color:#949ba4; text-align:center;">등록된 포켓몬이 없습니다.</p>`;
            } else {
                listDiv.innerHTML = pokemonList.map(p => `
                    <div class="poke-detail-item">
                        <span style="font-weight:bold; color:white;"><i class="fa-solid fa-bolt" style="color:#ffcb05;"></i> ${p.name}</span>
                        <span class="level">Lv.${p.level}</span>
                    </div>
                `).join('');
            }
            document.getElementById("detailModal").style.display = "flex";
        }

        // 수정 인증 모달 열기
        window.openAuthModal = function() {
            closeModal('detailModal');
            document.getElementById("editTitle").innerText = `${currentMember} 프로필 수정`;
            document.getElementById("inputPassword").value = "";
            document.getElementById("authSection").style.display = "block";
            document.getElementById("editSection").style.display = "none";
            document.getElementById("editModal").style.display = "flex";
        }

        window.verifyPassword = async function() {
            const pwd = document.getElementById("inputPassword").value;
            let realPwd = "1234";

            try {
                const docRef = doc(db, "profiles", currentMember);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists() && docSnap.data().password) {
                    realPwd = docSnap.data().password;
                }
            } catch(e) {}

            if (pwd === realPwd) {
                document.getElementById("authSection").style.display = "none";
                document.getElementById("editSection").style.display = "block";
                renderEditList();
            } else {
                alert("비밀번호가 올바르지 않습니다.");
            }
        }

        function renderEditList() {
            const listDiv = document.getElementById("pokeEditList");
            listDiv.innerHTML = "";

            currentPokemonList.forEach((p, idx) => {
                const row = document.createElement("div");
                row.className = "edit-poke-row";
                row.innerHTML = `
                    <input type="text" value="${p.name}" placeholder="포켓몬 이름" onchange="updateTempData(${idx}, 'name', this.value)" style="flex:2;">
                    <input type="number" value="${p.level}" placeholder="레벨" onchange="updateTempData(${idx}, 'level', this.value)" style="flex:1;">
                    <button class="btn-del" onclick="removePokeInput(${idx})"><i class="fa-solid fa-trash"></i></button>
                `;
                listDiv.appendChild(row);
            });
        }

        window.updateTempData = (idx, key, val) => {
            if (key === 'level') val = Number(val);
            currentPokemonList[idx][key] = val;
        };

        window.addPokeInput = () => {
            currentPokemonList.push({ name: "", level: 1 });
            renderEditList();
        };

        window.removePokeInput = (idx) => {
            currentPokemonList.splice(idx, 1);
            renderEditList();
        };

        window.saveData = async function() {
            const cleanedList = currentPokemonList.filter(p => p.name.trim() !== "");

            try {
                const docRef = doc(db, "profiles", currentMember);
                await setDoc(docRef, { password: "1234", pokemonList: cleanedList }, { merge: true });
                alert("저장되었습니다!");
                closeModal('editModal');
                loadProfiles();
            } catch(e) {
                alert("저장 실패: Firebase 설정을 확인해주세요.");
            }
        }

        window.closeModal = (id) => { document.getElementById(id).style.display = "none"; };

        // 2. 명령어 목록 렌더링
        function renderCommands() {
            const container = document.getElementById("cmd-container");
            container.innerHTML = commandsData.map(c => `
                <div class="cmd-card">
                    <div class="cmd-code">
                        <span>${c.cmd}</span>
                        <button class="cmd-copy-btn" onclick="copyText('${c.cmd}')"><i class="fa-regular fa-copy"></i></button>
                    </div>
                    <div class="cmd-desc">${c.desc}</div>
                </div>
            `).join('');
        }

        // 3. 조건(규칙) 렌더링
        function renderRules() {
            const container = document.getElementById("rules-container");
            container.innerHTML = rulesData.map(r => `
                <div class="rule-card">
                    <i class="fa-solid fa-ban"></i>
                    <div class="rule-text">${r}</div>
                </div>
            `).join('');
        }

        // 4. 위치(좌표) 렌더링
        function renderLocations() {
            const container = document.getElementById("location-container");
            container.innerHTML = locationsData.map(l => `
                <div class="location-card">
                    <div class="loc-info">
                        <h4>${l.name}</h4>
                        <div class="loc-coords">${l.coords}</div>
                    </div>
                    <button class="cmd-copy-btn" onclick="copyText('${l.coords}')"><i class="fa-regular fa-copy"></i> 좌표 복사</button>
                </div>
            `).join('');
        }

        window.copyText = (text) => {
            navigator.clipboard.writeText(text);
            alert(`복사되었습니다: ${text}`);
        };

        // 초기화
        loadProfiles();
        renderCommands();
        renderRules();
        renderLocations();
    </script>
</body>
</html>
